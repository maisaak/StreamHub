services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: streamhub
      POSTGRES_PASSWORD: streamhub
      POSTGRES_DB: streamhub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamhub"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [streamhub]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [streamhub]

  api:
    build: ./backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://streamhub:streamhub@db:5432/streamhub
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [streamhub]

  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.worker.celery_app:celery_app worker -l info --concurrency=2
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://streamhub:streamhub@db:5432/streamhub
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      - api
      - redis
      - db
    networks: [streamhub]

  beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.worker.celery_app:celery_app beat -l info
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://streamhub:streamhub@db:5432/streamhub
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      - worker
    networks: [streamhub]

  web:
    build: ./frontend
    restart: unless-stopped
    networks: [streamhub]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    networks: [streamhub]

volumes:
  pgdata:
  redisdata:

networks:
  streamhub:
