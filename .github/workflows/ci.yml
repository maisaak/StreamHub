name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
        working-directory: backend
      - name: Ruff
        run: ruff check app tests && ruff format --check app tests
        working-directory: backend
      - name: Mypy
        run: mypy app
        working-directory: backend
      - name: Tests
        run: pytest tests/ -q --cov=app --cov-report=term --cov-fail-under=80
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npx eslint src --ext .ts,.tsx
        working-directory: frontend
      - name: Typecheck + unit tests
        run: npx tsc --noEmit && npx vitest run
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend
        run: pip install -e ./backend
      - name: Install frontend
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start API
        run: nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 >/tmp/api.log 2>&1 &
        working-directory: backend
      - name: Start web
        run: nohup npm run dev -- --port 5173 >/tmp/web.log 2>&1 &
        working-directory: frontend
      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && curl -sf http://localhost:5173/ && break
            sleep 2
          done
      - name: Playwright
        run: npx playwright test
        working-directory: frontend
