name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
        working-directory: backend
      - name: Ruff
        run: ruff check app tests && ruff format --check app tests
        working-directory: backend
      - name: Mypy
        run: mypy app
        working-directory: backend
      - name: Tests
        run: pytest tests/ -q --cov=app --cov-report=term --cov-fail-under=80
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npx eslint src --ext .ts,.tsx
        working-directory: frontend
      - name: Typecheck + unit tests
        run: npx tsc --noEmit && npx vitest run
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend
        run: pip install -e ./backend
      - name: Install frontend
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start API
        run: nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 >/tmp/api.log 2>&1 &
        working-directory: backend
      - name: Start web
        run: nohup npm run dev -- --port 5173 >/tmp/web.log 2>&1 &
        working-directory: frontend
      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && curl -sf http://localhost:5173/ && break
            sleep 2
          done
      - name: Playwright
        run: npx playwright test --reporter=list 2>&1 | tee /tmp/pw.log; test ${PIPESTATUS[0]} -eq 0
        working-directory: frontend
      - name: Upload Playwright log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pw-log
          path: /tmp/pw.log
          retention-days: 1
      - name: Publish E2E log as check run
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json
          def tail(path, n):
              try:
                  return open(path, errors="replace").read()[-n:]
              except OSError:
                  return f"(missing {path})"
          payload = {
              "name": "e2e-log",
              "head_sha": "${{ github.sha }}",
              "status": "completed",
              "conclusion": "failure",
              "output": {
                  "title": "Playwright output (tail)",
                  "summary": "tail of /tmp/pw.log, /tmp/api.log, /tmp/web.log",
                  "text": ("=== pw.log ===\n" + tail("/tmp/pw.log", 50000)
                           + "\n=== api.log ===\n" + tail("/tmp/api.log", 6000)
                           + "\n=== web.log ===\n" + tail("/tmp/web.log", 6000))[-60000:],
              },
          }
          open("/tmp/check.json", "w").write(json.dumps(payload))
          PYEOF
          gh api "repos/${{ github.repository }}/check-runs" -X POST --input /tmp/check.json
      - name: Report E2E failure to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### E2E failure diagnostics (\`$GITHUB_SHA\`)"
            echo ""
            echo "<details><summary>playwright output (tail)</summary>"
            echo ""
            echo '```'
            tail -c 12000 /tmp/pw.log
            echo '```'
            echo "</details>"
            echo "<details><summary>api log (tail)</summary>"
            echo ""
            echo '```'
            tail -c 4000 /tmp/api.log
            echo '```'
            echo "</details>"
            echo "<details><summary>web log (tail)</summary>"
            echo ""
            echo '```'
            tail -c 4000 /tmp/web.log
            echo '```'
            echo "</details>"
          } > /tmp/comment.md
          gh pr comment "$PR" --body-file /tmp/comment.md
